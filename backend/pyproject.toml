[project]
name = "marfil-backend"
version = "0.1.0"
description = "API de Sistema Marfil: inventario, ventas, cobranza y recordatorios"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "pwdlib[argon2]==0.3.1",
    "jinja2==3.1.6",
    "cachetools==7.1.7",
    "apscheduler==3.11.3",
    "openpyxl==3.1.5",
    "requests==2.34.2",
    "fpdf2==2.8.7",
    "python-multipart==0.0.32",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
